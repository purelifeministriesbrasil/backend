name: CI — purelife-api

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test, Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout contracts
        uses: actions/checkout@v4
        with:
          repository: purelifeministriesbrasil/contracts
          path: contracts

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build shared contracts
        run: |
          cd contracts
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Install backend dependencies
        run: |
          cd backend
          pnpm install --no-frozen-lockfile

      - name: Run unit and AppSec tests
        run: |
          cd backend
          pnpm test

      - name: Verify Clean Architecture boundaries
        run: |
          cd backend
          pnpm lint

      - name: Typecheck and build
        run: |
          cd backend
          pnpm build
