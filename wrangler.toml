name = "purelife-api"
main = "src/index.ts"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]

# Logs estruturados (JSON) no Workers Logs; PII é removida pelo scrubber antes da emissão.
[observability]
enabled = true

# Domínio da API na conta institucional (zona purelifeministriesbrasil.org na mesma conta Cloudflare).
# Comente esta seção para publicar apenas em *.workers.dev durante a homologação.
[[routes]]
pattern = "api.purelifeministriesbrasil.org"
custom_domain = true

[vars]
PUBLIC_SITE_ORIGIN = "https://purelifeministriesbrasil.org"
ENVIRONMENT = "production"
# Gateway de pagamento: AINDA NÃO ESCOLHIDO (decisão em aberto). Sem PAYMENT_PROVIDER o Worker responde 503
# (fail-closed) em /api/donations/* e /api/webhooks/payment; formulários e demais rotas não são afetados.
# O site usa a chave PIX manual (PUBLIC_ENABLE_PIX_GATEWAY=false). Quando houver decisão: asaas | mercadopago.
# PAYMENT_PROVIDER = "..."
PIX_EXPIRATION_MINUTES = "60"
TRIAGE_KEY_CURRENT_VERSION = "1"
EMAIL_FROM = "Pure Life Ministries Brasil <nao-responda@purelifeministriesbrasil.org>"
STAFF_NOTIFICATION_EMAIL = "purelifeministriesbrasil1986@gmail.com"
# Só se aplica ao provedor Asaas, se vier a ser escolhido (produção: https://api.asaas.com/v3;
# sandbox: https://api-sandbox.asaas.com/v3).
# ASAAS_API_BASE_URL = "https://api.asaas.com/v3"
# Limitação de taxa por IP e endpoint (R5): off | log | enforce. "log" só registra `rate_limit.would_block`
# (homologação); trocar para "enforce" é uma decisão deliberada após avaliar IPs compartilhados e tráfego legítimo.
RATE_LIMIT_MODE = "log"

# Segredos obrigatórios (`wrangler secret put <NOME>`), nunca neste arquivo:
#   DATABASE_URL            Neon → Connect → conexão com pooling (host com "-pooler"); reserva do Hyperdrive
#   TRIAGE_KEY_V1           openssl rand -base64 32
#   HASH_PEPPER             openssl rand -base64 32
#   TURNSTILE_SECRET_KEY    Cloudflare → Turnstile → widget do site
#   RESEND_API_KEY          Resend → API Keys
# Provedor Asaas:           ASAAS_API_KEY, ASAAS_WEBHOOK_SECRET, ASAAS_DONATION_CUSTOMER_ID
# Provedor Mercado Pago:    MERCADOPAGO_ACCESS_TOKEN, MERCADOPAGO_WEBHOOK_SECRET, MERCADOPAGO_PAYER_FALLBACK_EMAIL

# Hyperdrive: pool de conexões na borda até o Postgres (Neon, sa-east-1). Com o binding presente,
# a API usa a conexão dele e DATABASE_URL vira apenas reserva. Criado com a conexão DIRETA do Neon
# (sem "-pooler"). Em `wrangler dev`, defina a variável de ambiente
# CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE com uma conexão local ou do Neon.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "9194030c37b94749ba819e8428d40edf"

# Expurgo LGPD diário às 03:00 UTC (00:00 em Brasília).
[triggers]
crons = ["0 3 * * *"]

# Rate Limiting (janela de 60 s, por IP). Valores INICIAIS de homologação, não limites definitivos.
# Webhooks de pagamento nunca são limitados. namespace_id é um identificador numérico da conta, único por binding.
[[unsafe.bindings]]
name = "RL_CONTACT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RL_TRIAGE"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RL_NEWSLETTER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RL_DONATION"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 5, period = 60 }
